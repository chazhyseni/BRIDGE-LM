name: dna-models
channels:
  - pytorch
  - nvidia
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.9
  - pytorch>=2.0.0
  - pytorch-cuda=11.8
  - cudatoolkit=11.8
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - matplotlib
  - seaborn
  - jupyter
  - ipykernel
  - bedtools
  - samtools
  - htslib
  - pip
  - pip:
    - transformers>=4.35.0
    - peft>=0.6.0
    - accelerate>=0.24.0
    - vllm>=0.2.0
    - biopython>=1.81
    - fastapi>=0.104.0
    - uvicorn[standard]>=0.24.0
    - rich>=13.6.0
    - einops>=0.7.0
    - sentencepiece>=0.1.99
